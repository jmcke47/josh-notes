# ======================================================================
#  UPDATE HOSTING CONFIG  (PLACEHOLDER - edit before publishing releases)
# ======================================================================
# UPDATE_MANIFEST_URL: where the app looks for update.json (baked into the APK
#   as BuildConfig.UPDATE_MANIFEST_URL; can also be overridden in-app via
#   menu > "Update source URL").
# UPDATE_BASE_URL: public base URL where release.sh's output (notes-app.apk)
#   will be hosted; used to fill "apkUrl" in the generated update.json.
#
# Example for GitHub Releases (repo josh/notes-app):
#   UPDATE_MANIFEST_URL=https://github.com/josh/notes-app/releases/latest/download/update.json
#   UPDATE_BASE_URL=https://github.com/josh/notes-app/releases/latest/download
UPDATE_MANIFEST_URL=https://REPLACE-ME.example.com/notes-app/update.json
UPDATE_BASE_URL=https://REPLACE-ME.example.com/notes-app
